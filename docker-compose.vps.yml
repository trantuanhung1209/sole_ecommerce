services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: sole_ecommerce
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - sole-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sole-network

  backend:
    image: ${DOCKERHUB_USER:-trantuanhung1209}/sole-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BACKEND_INTERNAL_PORT: 8081
      BACKEND_PORT: 8081
      MONGODB_URI: mongodb://mongodb:27017/sole_ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2000ms}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://your-domain.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      PERMISSION_ENFORCEMENT: ${PERMISSION_ENFORCEMENT:-true}
      CATALOG_SEED_ENABLED: ${CATALOG_SEED_ENABLED:-true}
      CATALOG_SEED_FORCE: ${CATALOG_SEED_FORCE:-false}
      REVIEW_SEED_ENABLED: ${REVIEW_SEED_ENABLED:-true}
      REVIEW_SEED_FORCE: ${REVIEW_SEED_FORCE:-false}
      USER_SEED_ENABLED: ${USER_SEED_ENABLED:-true}
      DEMO_OPS_SEED_ENABLED: ${DEMO_OPS_SEED_ENABLED:-true}
      USER_SEED_PASSWORD: ${USER_SEED_PASSWORD:-Sole@123}
      SEPAY_API_URL: ${SEPAY_API_URL:-https://pay.sepay.vn/v1/checkout/init}
      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-production}
      SEPAY_IPN_VERIFY: ${SEPAY_IPN_VERIFY:-true}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_IPN_URL: ${SEPAY_IPN_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_MAX_TOOL_LOOP: ${OPENAI_MAX_TOOL_LOOP:-4}
      OPENAI_STRUCTURED_OUTPUT_MODEL: ${OPENAI_STRUCTURED_OUTPUT_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-SOLE <onboarding@resend.dev>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-30000}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-2000000}
      VAT_RATE: ${VAT_RATE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - sole-network

  frontend:
    image: ${DOCKERHUB_USER:-trantuanhung1209}/sole-fe:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sole-network

networks:
  sole-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
