services:

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: www-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - www-network
    command: redis-server --appendonly yes

  # Redis Commander - Web UI for Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: www-redis-commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8082}:8081"
    environment:
      # BE chạy trên host dùng localhost:6379 — trỏ Commander về cùng instance (tránh Redis Docker rỗng)
      - REDIS_HOSTS=sole:host.docker.internal:6379
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - www-network
    depends_on:
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: sole-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - www-network

# Networks
networks:
  www-network:
    driver: bridge

# Volumes cho persistent data
volumes:
  gradle_cache:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
