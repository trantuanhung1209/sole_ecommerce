# Docker Compose profile — service hostnames on www-network
server.port=${BACKEND_INTERNAL_PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongodb:27017/sole_ecommerce}
spring.data.redis.host=${REDIS_HOST:redis}
search.elasticsearch-uri=${ELASTICSEARCH_URI:http://elasticsearch:9200}

# Demo / local tester defaults (override in .env for production-like runs)
permission.enforcement=false
catalog.seed.force=false
review.seed.force=false
app.bootstrap.reindex-on-startup=true
ai.reindex-on-startup=true
