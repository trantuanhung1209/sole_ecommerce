# Production profile — disable public Swagger UI
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Server & core infrastructure defaults (self-contained if application.properties is absent)
spring.application.name=sole-ecommerce
server.port=${BACKEND_INTERNAL_PORT:${BACKEND_PORT:8081}}
server.servlet.context-path=/api

# MongoDB & Redis
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sole_ecommerce}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Security defaults (overridable via env vars)
permission.enforcement=${PERMISSION_ENFORCEMENT:true}
cookie.domain=${COOKIE_DOMAIN:localhost}
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Google OAuth & Cloudinary & Resend
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:SOLE <onboarding@resend.dev>}

# SePay
sepay.api-url=${SEPAY_API_URL:https://pay.sepay.vn/v1/checkout/init}
sepay.merchant-id=${SEPAY_MERCHANT_ID:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.environment=${SEPAY_ENVIRONMENT:production}
sepay.ipn-url=${SEPAY_IPN_URL:}
sepay.ipn-verify=${SEPAY_IPN_VERIFY:true}

# Frontend (payment redirect URLs)
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Shipping & VAT
shipping.flat-fee=${SHIPPING_FLAT_FEE:30000}
shipping.free-threshold=${SHIPPING_FREE_THRESHOLD:2000000}
vat.rate=${VAT_RATE:0}

# Seed flags (overridable via env vars; secure prod defaults)
catalog.seed.enabled=${CATALOG_SEED_ENABLED:true}
catalog.seed.force=${CATALOG_SEED_FORCE:false}
review.seed.enabled=${REVIEW_SEED_ENABLED:true}
review.seed.force=${REVIEW_SEED_FORCE:false}
demo.ops.seed.enabled=${DEMO_OPS_SEED_ENABLED:false}
user.seed.enabled=${USER_SEED_ENABLED:false}
user.seed.password=${USER_SEED_PASSWORD:Sole@123}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.www=${APP_LOG_LEVEL:INFO}

# OpenAI & AI
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:30000}
openai.max-tool-loop=${OPENAI_MAX_TOOL_LOOP:4}
openai.structured-output-model=${OPENAI_STRUCTURED_OUTPUT_MODEL:gpt-4o-mini}
openai.vision-model=${OPENAI_VISION_MODEL:gpt-4o}
ai.conversation.history-turns=8
ai.reindex-on-startup=false
ai.retrieval.product-top-k=${AI_RETRIEVAL_PRODUCT_TOP_K:5}
ai.retrieval.policy-top-k=${AI_RETRIEVAL_POLICY_TOP_K:2}
ai.image.webp-quality=${AI_IMAGE_WEBP_QUALITY:85}
ai.image.max-input-bytes=${AI_IMAGE_MAX_INPUT_BYTES:10485760}
ai.image.max-dimension=${AI_IMAGE_MAX_DIMENSION:4096}

# Rate limits
rate-limit.enabled=true
rate-limit.window-minutes=15
rate-limit.ai-chat-max=${RATE_LIMIT_AI_CHAT_MAX:30}
rate-limit.ai-voice-max=${RATE_LIMIT_AI_VOICE_MAX:10}
rate-limit.ai-image-max=${RATE_LIMIT_AI_IMAGE_MAX:10}
